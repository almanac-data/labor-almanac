title: BLS Quarterly Census of Employment and Wages (QCEW)
description: |
  A quarterly count of employment and wages reported by employers through state unemployment-insurance programs, covering more than 95 percent of US jobs, by industry at the county, metropolitan area, state and national levels: the near-complete census of US jobs and pay.
