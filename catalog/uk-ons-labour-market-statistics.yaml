notes: |
  Human-verified 2026-10-31: HTTP 200. The page reads "People in and out of work covering employment, unemployment, types of work, earnings, working patterns and workplace disputes", with sections "People in work" ("Employment data covering employment rates, hours of work and earnings") and "People not in work" ("Unemployed and economically inactive people in the UK including claimants of out-of-work benefits and the number of redundancies"). The landing page doesn't show a latest release. The monthly cadence reflects the headline labour market release. The formats, the ONS API and the start years weren't checked, and neither were any LFS quality caveats.
  Licence checked 2026-10-31: the ONS terms and conditions (https://www.ons.gov.uk/help/terms-conditions, redirected from /help/termsandconditions) say "Most content on this website is subject to Crown copyright protection and is published under the Open Government Licence (OGL). Some content is exempt from the OGL – check the list of exemptions." The site footer says "All content is available under the Open Government Licence v3.0, except where otherwise stated". These are site-wide terms, not a dataset-specific licence.
