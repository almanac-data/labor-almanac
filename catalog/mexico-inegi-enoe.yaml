notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page "Encuesta Nacional de Ocupación y Empleo (ENOE), población de 15 años y más de edad". It says the ENOE "es la principal fuente de información sobre el mercado laboral mexicano al ofrecer datos mensuales y trimestrales de la fuerza de trabajo, la ocupación, la informalidad laboral, la subocupación y la desocupación". It shows "Indicadores de Ocupación y Empleo — Publicación reciente: 22 de octubre de 2026" (next 26 November 2026) and the quarterly ENOE "Publicación reciente: 25 de agosto de 2026" (next 25 November 2026). The page says the April-June 2020 figures come from the telephone ETOE and Q3 2020 to Q4 2022 from the ENOEN. INEGI's Radware bot manager redirected plain curl (HTTP 403 / validate.perfdrive.com), so this needs a browser. The English mirror en.www.inegi.org.mx answered HTTP 200 to curl. The microdata formats and the indicator API weren't checked.
  Licence checked 2026-10-31: INEGI's terms page (https://www.inegi.org.mx/inegi/terminos.html, read in headless Chromium) says users "Puede utilizar la información del INEGI con apego a lo dispuesto en los 'Términos de Libre Uso de la Información del INEGI'". These permit copying, adaptation and commercial use, and the user "Debe otorgar los créditos correspondientes al INEGI como autor ... de la siguiente manera: 'Fuente: INEGI, nombre del producto de donde se extrae la información'".
