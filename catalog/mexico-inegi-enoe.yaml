title: INEGI — National Occupation and Employment Survey (ENOE), Mexico
description: |
  Mexico's main labour market survey, run by the national statistics institute: monthly and quarterly data on the labour force, employment, labour informality, underemployment and unemployment for the population aged 15 and over, nationally, by state and for major cities.
