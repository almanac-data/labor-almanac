title: BLS Occupational Employment and Wage Statistics (OEWS)
description: |
  Annual employment and wage estimates for about 830 occupations, for the nation, states, and metropolitan and nonmetropolitan areas, with national estimates by industry: the standard US source for pay by occupation.
