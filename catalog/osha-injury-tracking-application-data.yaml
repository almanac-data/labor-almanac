notes: |
  Human-verified 2026-10-31: HTTP 200. The old URL https://www.osha.gov/Establishment-Specific-Injury-and-Illness-Data redirects here. The page is titled "Injury Tracking Application (ITA) Data: Establishment and Case Detail Work-related Injury and Illness Data" and says "Certain establishments submitted summary data from the OSHA Form 300A since 2016. Beginning in 2024, some establishments were also required to submit certain case details from OSHA Forms 300 and 301." The current files are "2025 Summary Data" and "2025 Case Detail Data", "covering 2025 work-related injuries and illnesses submitted from 1/1/2026 through 8/31/2026". A notice says the CY2023 and CY2024 case detail datasets were updated with OIICS-coded data. The page links technical guidance, including "Comparison Between OSHA ITA Data and BLS SOII Estimates" and "Representativeness of Data"; the data covers only establishments required to report and is not a national estimate. The download format is assumed to be CSV and wasn't opened. OSHA inspection and violation data are covered under dol-open-data-portal.
  Licence checked 2026-10-31: DOL's Public Domain Copyright page (https://www.dol.gov/general/aboutdol/copyright) says "Materials created by the federal government are generally part of the public domain and may be used, reproduced and distributed without permission." This is department-wide and applies to OSHA as a DOL agency; no ITA-specific licence was found.
