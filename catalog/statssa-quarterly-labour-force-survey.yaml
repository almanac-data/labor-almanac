title: Stats SA Quarterly Labour Force Survey (QLFS), South Africa
description: |
  Statistics South Africa's quarterly household survey of the labour market and the source of South Africa's official and expanded unemployment rates, with employment by industry and sector (formal and informal), labour force participation and labour underutilisation, nationally and by province.
