notes: |
  Human-verified 2026-10-31: HTTP 200, publication page "P0211 - Quarterly Labour Force Survey (QLFS), 2nd Quarter 2026", "Publication date & time: 11 August 2026 @ 11:00". The downloads are the full publication (PDF, 4.76 MB), a media release, a presentation, "Economically active population QLFS Q2 2026" and "QLFS Trends 2008-2026Q2" (1.64 MB). The spreadsheet format of the trends file is assumed and wasn't opened. The canonical URL is a series page (PPN=P0211) whose content rolls to the latest quarter. The description's split into official and expanded unemployment and into formal and informal employment comes from Stats SA's usual QLFS content and wasn't read on this page. Microdata (through the DataFirst portal) and the SuperWEB2 tables weren't checked.
  Licence checked 2026-10-31: Stats SA's copyright and disclaimer page (https://www.statssa.gov.za/?page_id=425) says "All Stats SA products are protected by copyright. Users may apply the information as they wish, provided that they acknowledge Stats SA as the source of the basic data wherever they process, apply, utilise, publish or distribute the data, and also that they specify that the relevant application and analysis (where applicable) result from their own processing of the data."
