id: bls-cpi
type: dataset
title: BLS Consumer Price Index (CPI)
description: |
  The official US measure of consumer price inflation: the average change over time in the prices urban consumers pay for a market basket of goods and services, for the US and various metropolitan areas and regions, with average price data for selected food, fuel and utility items. Belongs here as the deflator for real wages; economy-almanac cross-references it.
