notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page "CPI Home : U.S. Bureau of Labor Statistics". The latest release, dated 10/14/2026, is "CPI for all items increases 0.6% in September; gasoline rises": "the Consumer Price Index for All Urban Consumers rose 0.6 percent, seasonally adjusted (SA), and rose 3.7 percent over the year". The page says the October 2026 CPI is due "November 10, 2026". It also notes that BLS in summer 2025 "announced reductions to CPI data collection across the country and a suspension of data collection in Lincoln, Nebraska; Provo, Utah; and Buffalo, New York", and that some Baltimore energy index data for June to September 2026 "were incorrect as published". The formats and the flat-file download (download.bls.gov, HTTP 403 to curl) were not checked. bls.gov returned HTTP 403 "Access Denied" (Akamai) to curl with a browser user agent and to default headless Chromium. It answered only in Chromium's new headless mode (playwright chromium.launch with channel "chromium"), so the vertical needs reachability.headless: true and may need that launch mode. The BLS Public Data API (api.bls.gov) answered HTTP 200 but returned "REQUEST_NOT_PROCESSED ... daily threshold ... has been reached" for an unkeyed request through this shared proxy. Heavy use needs a free registration key, and the documented limits were not checked.
  Licence checked 2026-10-31: BLS Copyright Information (https://www.bls.gov/opub/copyright-information.htm, read in headless Chromium) says "The Bureau of Labor Statistics (BLS) is a Federal government agency and everything that we publish, both in hard copy and electronically, is in the public domain, except for previously copyrighted photographs and illustrations. You are free to use our public domain material without specific permission, although we do ask that you cite the Bureau of Labor Statistics as the source." The BLS emblem is a registered trademark.
