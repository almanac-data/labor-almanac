notes: |
  Human-verified 2026-10-31: HTTP 200 (curl; the page is a JavaScript app and was read in headless Chromium). With the Topic facet set to Employment it reports "68 datasets found" across "Benefits, earnings and wages" (21), "Employment indicators" (37), "Unemployment indicators" (19) and "Employment protection" (1); the first entries include "Annual labour force survey, summary tables" and "Adequacy of minimum income benefits". The SDMX API at https://sdmx.oecd.org/public/rest/ answered HTTP 200; the download formats listed here are assumed. The OECD employment topic page (https://www.oecd.org/en/topics/employment.html) sat behind a Cloudflare challenge and could not be read.
  Licence checked 2026-10-31: OECD Terms and Conditions (https://www.oecd.org/en/about/terms-conditions.html; behind Cloudflare, it loaded in headless Chromium on some attempts). On the CC BY 4.0 question: CC BY 4.0 applies to "most OECD written content published as of 1 July 2024". Data have their own terms under "3. Data", Permitted Use: "Except where additional restrictions apply as stated above, you can extract from, download, copy, adapt, print, distribute, share and embed Data for any purpose, even for commercial use. You must give appropriate credit to the OECD by using the citation associated with the relevant Data". Users must also pass the acknowledgement requirement on in sub-licences, and check for third-party ownership in each dataset's metadata. So the data are open with attribution, but they are not CC BY 4.0. The individual datasets' metadata was not checked for third-party restrictions.
