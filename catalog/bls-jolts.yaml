notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page "JOLTS Home : U.S. Bureau of Labor Statistics". The latest release is "August job openings and hires change little; total separations unchanged" (09/29/2026), and "Annual 2025 state job openings and labor turnover data available; monthly data revised" (07/22/2026) is also listed. The page says the September 2026 JOLTS is due "November 3, 2026, 10:00 A.M. Eastern Time". The page did not quote a programme description, so the description follows JOLTS's standard scope. The formats and start year were not checked. bls.gov returned HTTP 403 "Access Denied" (Akamai) to curl with a browser user agent and to default headless Chromium. It answered only in Chromium's new headless mode (playwright chromium.launch with channel "chromium"), so the vertical needs reachability.headless: true and may need that launch mode. The BLS Public Data API (api.bls.gov) answered HTTP 200 but returned "REQUEST_NOT_PROCESSED ... daily threshold ... has been reached" for an unkeyed request through this shared proxy. Heavy use needs a free registration key, and the documented limits were not checked.
  Licence checked 2026-10-31: BLS Copyright Information (https://www.bls.gov/opub/copyright-information.htm, read in headless Chromium) says "The Bureau of Labor Statistics (BLS) is a Federal government agency and everything that we publish, both in hard copy and electronically, is in the public domain, except for previously copyrighted photographs and illustrations. You are free to use our public domain material without specific permission, although we do ask that you cite the Bureau of Labor Statistics as the source." The BLS emblem is a registered trademark.
