notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page "LAUS Home : U.S. Bureau of Labor Statistics". It says "The Local Area Unemployment Statistics (LAUS) program produces monthly and annual employment, unemployment, and labor force data for Census regions and divisions, States, counties, metropolitan areas, and many cities, by place of residence." Recent releases are "September jobless rates down in 5 states; payroll jobs up in 2 states, down in 1" (10/20/2026) and "Sept. jobless rates down over the year in 226 of 387 metro areas; payroll jobs up in 11" (10/28/2026). The formats and start years were not checked. bls.gov returned HTTP 403 "Access Denied" (Akamai) to curl with a browser user agent and to default headless Chromium. It answered only in Chromium's new headless mode (playwright chromium.launch with channel "chromium"), so the vertical needs reachability.headless: true and may need that launch mode. The BLS Public Data API (api.bls.gov) answered HTTP 200 but returned "REQUEST_NOT_PROCESSED ... daily threshold ... has been reached" for an unkeyed request through this shared proxy. Heavy use needs a free registration key, and the documented limits were not checked.
  Licence checked 2026-10-31: BLS Copyright Information (https://www.bls.gov/opub/copyright-information.htm, read in headless Chromium) says "The Bureau of Labor Statistics (BLS) is a Federal government agency and everything that we publish, both in hard copy and electronically, is in the public domain, except for previously copyrighted photographs and illustrations. You are free to use our public domain material without specific permission, although we do ask that you cite the Bureau of Labor Statistics as the source." The BLS emblem is a registered trademark.
