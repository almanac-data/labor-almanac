  The Department of Labor's open data portal, successor to enforcedata.dol.gov: Wage and Hour Division enforcement cases, OSHA inspections, violations and accident investigations, MSHA mine inspections and violations, EBSA case data, and unemployment insurance weekly claims, among other agency datasets.
